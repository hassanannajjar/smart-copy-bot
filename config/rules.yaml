# All thresholds live here (PLAN §4, §5, §9). Every key is required; unknown keys are rejected.
# Values marked "placeholder, tune" are not specified by PLAN.md and need review.

data:
  max_snapshot_age_s: 60 # placeholder, tune. Older snapshot => KILLED data_unavailable

prefilters: # SKIPPED, not counted as kills
  ignore_sells: true
  ignored_mints: # SOL / stables / majors
    - So11111111111111111111111111111111111111112 # wSOL
    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v # USDC
    - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB # USDT
  token_age_min_h: 0 # placeholder, tune
  token_age_max_h: 72 # placeholder, tune
  min_buy_sol: 0.5 # placeholder, tune. Drops dust buys
  mint_cooldown_h: 6 # placeholder, tune

rules: # killed_by = first failing rule in this order
  order: [R1, R2, R3, R4, R5, R6]
  R1_min_liquidity_usd: 30000
  R2_max_top10_pct: 40 # excludes pool/LP, burn, known program addresses
  R3_max_dev_pct: 8
  R4_max_bundled_pct: 15 # v1 heuristic, tunable in replay
  R4_window_s: 60
  R5_max_price_change_45m_pct: 80
  R6_require_mint_revoked: true
  R6_require_freeze_revoked: true
  R6_min_lp_locked_pct: 90 # only where the venue has LP tokens

paper:
  position_size_usd: 50
  simulated_latency_ms: 1500 # home; use 300 on a VPS
  base_fee_sol: 0.000005
  # placeholder, deliberately conservative: underestimating costs inflates paper PnL.
  # M3 replaces this with a live estimate from Helius' priority fee API.
  priority_fee_sol: 0.001
  poll_interval_s: 5
  rug_liquidity_drop_pct: 50 # placeholder, tune. Drop between polls => exit_reason=rug

guard:
  stop_loss_pct: -30
  take_profit:
    - { at_multiple: 2, sell_pct: 50 }
  trailing_stop_pct: 25 # on the remainder after the TP ladder
  time_stop_h: 24

analyst:
  enabled: false
  shadow: true
  timeout_ms: 3000

live: # M7 only; enforced by the engine gate
  max_position_usd: 50 # placeholder, tune
  max_open_positions: 3 # placeholder, tune
  max_trades_per_hour: 5 # placeholder, tune
  daily_loss_limit_usd: 50 # placeholder, tune. Hit => auto-halt
  max_wallet_balance_sol: 2 # placeholder, tune
  slippage_cap_bps: 300 # placeholder, tune
  priority_fee_cap_sol: 0.001 # placeholder, tune

discovery: # M0.5 `pnpm wallets:discover`: builds data/wallets.candidates.csv for manual review
  windows_days: [7, 30, 90]
  min_trades: 50
  min_days: { "7": 3, "30": 10, "90": 10 } # per window; Solana Tracker only (Birdeye has no trading-days filter)
  max_single_token_pct: 30 # ST server filter + our top_token_pct check
  exclude_arbitrage: true
  pnl_mode: strict
  page_limit: 100
  # Per window. ST is sorted by realized PnL, so its top pages are mostly HF bots: page deeper
  # (3 windows x 20 = up to 60 requests). Birdeye rows cannot be identity-checked on our plan.
  max_pages: { solanatracker: 20, birdeye: 5 }
  enrich_top_n: 160 # ST positions calls (top_token_pct, hold) + Helius checks; 80 never reached on-chain-identity rows
  enrich_period: all # positions scope for top_token_pct (all-time)
  # Human-likeness filters (each has its own drop reason in the report). Placeholders, tune.
  max_trades_per_day: 60 # trades / window days above this => bot_trade_rate
  min_win_rate_pct: 25 # token win rate below this => low_win_rate (rows without a win rate are kept)
  suspicious_win_rate_pct: 90 # token win rate >= this AND trades >= next => implausible_win_rate
  suspicious_win_rate_min_trades: 300
  max_avg_trade_usd: 3000 # avg trade above this => whale_trade_size (we copy ~$50)
  min_median_hold_s: 120 # enriched wallets: median position hold below this => short_hold
  drop_identity_labels: # matched against identity type/tags from either provider
    [arbitrage, potential_bot, bot, pool, exchange, protocol, program, token, hacker, spam]
  report_top: 30
  # Helius check of enriched candidates that survive the top-token check: newest signatures ->
  # getTransaction on the newest non-failed ones -> M1 parseSwap. ~1 + tx_sample credits each.
  activity:
    signatures_limit: 20
    tx_sample: 10
    max_inactive_h: 48 # no swap seen in the sample within this => inactive
    min_sol_quote_pct: 50 # SOL-quoted share of sampled swaps below this => not_memecoin_trader
  starter: # `starter` CSV column: identity checked + activity checked + all of these
    min_sol_quote_pct: 50
    max_trades_per_day: 55 # raised from 40 on 2026-10-29
    max_avg_trade_usd: 3000
    min_win_rate_pct: 25 # when known
    max_win_rate_pct: 85 # when known
    max_top_token_pct: 30 # when known
    max_wallets: 30 # starter=true on at most this many, in rank order
  solanatracker: { min_interval_ms: 350, timeout_ms: 10000, retries: 4 } # free plan: 3 rps
  birdeye: { min_interval_ms: 2000, timeout_ms: 10000, retries: 4 } # Standard plan: 1 rps; 0.5 rps for headroom (429s at 1.1s)
  helius: { min_interval_ms: 250, timeout_ms: 10000, retries: 4 } # free plan 10 rps, shared with the running engine

scout: # M1: Helius logsSubscribe per wallet + getTransaction (docs/providers/helius.md)
  commitment: confirmed
  quote_mint: So11111111111111111111111111111111111111112 # wSOL; SOL-quoted swaps only in v1
  ping_interval_ms: 30000 # Helius drops idle sockets after 10 min; no pong by next ping => reconnect
  heartbeat_interval_ms: 60000 # events_log stage=scout heartbeat row (dashboard reads it)
  reconnect_base_ms: 1000
  reconnect_max_ms: 30000
  tx_fetch_retries: 5 # getTransaction can be null right after the notification
  tx_fetch_delay_ms: 500
  backfill_limit: 25 # signatures per wallet, on boot (since last stored signal) and on reconnect
  rpc: { min_interval_ms: 150, timeout_ms: 10000, retries: 4 } # free plan: 10 rps

enricher: # M2: provider limits + how R2/R4/R5 are measured (thresholds stay in rules:)
  dexscreener: { min_interval_ms: 250, timeout_ms: 10000, retries: 4 } # 300 req/min on /token-pairs
  rugcheck: { min_interval_ms: 4500, timeout_ms: 15000, retries: 3 } # keyless: x-rate-limit-limit 15
  geckoterminal: { min_interval_ms: 6500, timeout_ms: 10000, retries: 3 } # keyless: ~10 calls/min
  helius: { min_interval_ms: 500, timeout_ms: 15000, retries: 4 } # shares the 10 rps plan with scout.rpc
  R2_exclude_known_types: [AMM] # pool vaults; lockers and the creator still count (conservative)
  R2_exclude_owners:
    - 1nc1nerator11111111111111111111111111111111 # incinerator
    - "11111111111111111111111111111111" # system program
  R4_slot_cluster_min_buyers: 5 # placeholder, tune (3 over-counted organic snipers). Distinct buyers in one launch-window slot => cluster
  R4_max_pages: 5 # placeholder, tune. 100 txs/page; more than this in the window => data_unavailable
  R5_window_min: 45 # PLAN §4 R5
